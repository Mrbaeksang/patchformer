name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

jobs:
  phase0:
    name: Phase 0 checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned development dependencies
        run: |
          python -m pip install --upgrade pip==26.0.1
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Test
        run: python -m pytest

      - name: CPU smoke test
        run: >-
          python -m patchformer smoke
          --output data/generated/ci-smoke.jsonl
          --examples-per-split 10
          --seed 20261118
